run_id: "genai_interview"
seed: 42

model:
  model_id: "google/gemma-3-1b-it"
  tokenizer_id: "google/gemma-3-1b-it"
  revision: null

embeddings:
  model_id: "sentence-transformers/paraphrase-MiniLM-L3-v2"

device:
  device_strategy: "cpu"
  device_map: "cpu"
  torch_dtype: "float32"
  quantization: "none"

tokenization:
  padding: "max_length"
  truncation: true
  max_length: 128

generation:
  max_new_tokens: 64
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true

logging:
  output_root: "outputs"
  logs_dir: "outputs/logs"
  results_dir: "outputs/results"
