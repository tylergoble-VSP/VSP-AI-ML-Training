[pytest]
# Pytest configuration file
# This file configures how pytest discovers and runs tests
#
# Educational Context:
# pytest.ini is a configuration file for pytest (Python testing framework).
# It sets default options so you don't have to type them every time.
#
# Configuration Options Explained:
# - testpaths: Where to look for tests (tests directory)
# - python_files: Pattern for test files (must start with "test_")
# - python_classes: Pattern for test classes (must start with "Test")
# - python_functions: Pattern for test functions (must start with "test_")
# - addopts: Additional command-line options (applied automatically)

# Directory where pytest looks for test files
# Only searches in the "tests" directory
testpaths = tests

# Pattern for test file names
# Files matching "test_*.py" are recognized as test files
# Example: test_timing.py, test_paths.py
python_files = test_*.py

# Pattern for test class names
# Classes starting with "Test" are recognized as test classes
# Example: class TestTiming:
python_classes = Test*

# Pattern for test function names
# Functions starting with "test_" are recognized as test functions
# Example: def test_timing():
python_functions = test_*

# Additional command-line options (applied to all test runs)
addopts = 
    -v              # Verbose output (shows each test name)
    --tb=short      # Short traceback format (less verbose on errors)
    --strict-markers # Require markers to be registered (prevents typos)
    --disable-warnings # Suppress warning messages (cleaner output)

